version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: eventflow-mysql
    environment:
      MYSQL_DATABASE: eventflow
      MYSQL_USER: eventflow
      MYSQL_PASSWORD: eventflow
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventflow-backend
    working_dir: /app
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      APP_SECRET: docker_eventflow_secret
      DATABASE_URL: mysql://eventflow:eventflow@mysql:3306/eventflow?serverVersion=8.0&charset=utf8mb4
      JWT_SECRET_KEY: /app/config/jwt/private.pem
      JWT_PUBLIC_KEY: /app/config/jwt/public.pem
      JWT_PASSPHRASE: ""
      JWT_TTL: 3600
      CORS_ALLOW_ORIGIN: ^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "
      composer install &&
      mkdir -p config/jwt &&
      if [ ! -f config/jwt/private.pem ]; then
        openssl genrsa -out config/jwt/private.pem 4096 &&
        openssl rsa -pubout -in config/jwt/private.pem -out config/jwt/public.pem;
      fi &&
      php bin/console doctrine:database:create --if-not-exists &&
      php bin/console doctrine:migrations:migrate --no-interaction &&
      php -S 0.0.0.0:8000 -t public
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eventflow-frontend
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost/api
    volumes:
      - ./frontend:/app
    command: >
      sh -c "
      npm install &&
      npm run dev -- --host 0.0.0.0 --port 5173
      "

  nginx:
    image: nginx:1.27-alpine
    container_name: eventflow-nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql_data:
